<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="course-card">
      <img
        src="assets/images/illustration-article.svg"
        alt="Course Illustration"
      />
      <div class="course-meta">
        <div class="course-tags">
          <span class="course-tag">Learning</span>
        </div>
        <time class="course-published-date" datetime="2023-12-21">
          Published 21 Dec 2023
        </time>
      </div>
      <h2 class="course-title">HTML & CSS foundations</h2>
      <p class="course-body">
        These languages are the backbone of every website, defining structure,
        content, and presentation.
      </p>
      <footer class="course-footer">
        <img
          class="course-creator-avatar"
          width="65"
          height="65"
          src="assets/images/image-avatar.webp"
          alt="Greg Hooper avatar"
        />
        <span class="course-creator">Greg Hooper</span>
      </footer>
    </article>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Yasin</a>.
    </footer>
  </body>
</html>
